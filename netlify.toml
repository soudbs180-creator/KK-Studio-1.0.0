[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  command = "npm run build"
  publish = "apps/web/dist"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
[[redirects]]
  from = "/api/generate/image"
  to = "/.netlify/functions/generate-image"
  status = 200

[[redirects]]
  from = "/api/generate-image"
  to = "/.netlify/functions/generate-image"
  status = 200

[[redirects]]
  from = "/api/generate/edit"
  to = "/.netlify/functions/generate-image"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/openai-chat"
  status = 200

[[redirects]]
  from = "/api/user/*"
  to = "/.netlify/functions/user"
  status = 200

[[redirects]]
  from = "/api/billing/*"
  to = "/.netlify/functions/billing"
  status = 200

[[redirects]]
  from = "/api/generations"
  to = "/.netlify/functions/generations"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
