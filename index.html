<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="description" content="KK Studio - AI Image Generation Workspace" />
    <title>KK Studio - AI Image Workspace</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="dns-prefetch" href="//challenges.cloudflare.com" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #09090b;
            color: #ffffff;
        }

        body:not(.dark-mode) {
            background: #fffaf0;
            color: #0a0a0a;
        }
    </style>
</head>

<body>
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme') || localStorage.getItem('kk_theme');
                var isDark = false;
                if (stored === 'dark') {
                    isDark = true;
                } else if (stored === 'light') {
                    isDark = false;
                } else {
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark-mode');
                    document.documentElement.dataset.theme = 'dark';
                    document.body.dataset.theme = 'dark';
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark-mode');
                    document.documentElement.dataset.theme = 'light';
                    document.body.dataset.theme = 'light';
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch (e) {}
        })();
    </script>
    <div id="root">
        <!-- 静态高保真 Loading 骨架页，React 挂载后会自动替换它 -->
        <div class="app-startup-screen" style="display: grid; min-height: 100dvh; place-items: center; overflow: hidden; padding: 32px; position: fixed; inset: 0; z-index: 9999;">
            <div class="app-startup-shell" style="position: relative; z-index: 1; width: min(400px, calc(100vw - 64px)); margin: 0 auto;">
                <section class="app-startup-card" style="position: relative; overflow: hidden; width: 100%; border: 1px solid var(--app-startup-panel-border, rgba(255, 255, 255, 0.06)); border-radius: 20px; padding: 24px 28px; background: var(--app-startup-panel-bg, #141414); box-shadow: var(--app-startup-panel-shadow, 0 20px 40px rgba(0,0,0,0.3));">
                    <div class="app-startup-stage-line" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--app-startup-muted, rgba(255, 255, 255, 0.7)); font-size: 13px;">
                        <span>正在加载中...</span>
                        <strong style="color: var(--app-startup-title, #ffffff); font-size: 12px; font-weight: 700;">0%</strong>
                    </div>
                    <div class="app-startup-progress-track" style="height: 4px; margin-top: 10px; overflow: hidden; background: var(--app-startup-track-bg, rgba(255, 255, 255, 0.06)); border-radius: 999px;">
                        <span style="display: block; height: 100%; min-width: 12%; background: linear-gradient(90deg, var(--app-startup-accent-strong, #ffb084), var(--app-startup-accent, #ffb084)); border-radius: inherit; width: 12%;"></span>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var turnstileScriptUrl = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            var turnstileScriptSelector = 'script[data-turnstile-script="true"]';

            if (document.querySelector(turnstileScriptSelector)) {
                return;
            }

            var script = document.createElement('script');
            script.src = turnstileScriptUrl;
            script.async = true;
            script.defer = true;
            script.dataset.turnstileScript = 'true';

            if ('fetchPriority' in script) {
                script.fetchPriority = 'high';
            }

            document.head.appendChild(script);
        })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
