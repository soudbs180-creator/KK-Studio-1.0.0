<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="description" content="KK Studio - AI Image Generation Workspace" />
    <title>KK Studio - AI Image Workspace</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="dns-prefetch" href="//challenges.cloudflare.com" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #09090b;
            color: #ffffff;
        }

        body:not(.dark-mode) {
            background: #fffaf0;
            color: #0a0a0a;
        }
    </style>
</head>

<body>
    <script>
        // 简体中文注释：立即执行脚本，避免 React 挂载前由于亮暗色状态不同产生首屏闪白
        (function () {
            try {
                var stored = localStorage.getItem('theme') || localStorage.getItem('kk_theme');
                var isDark = false;
                if (stored === 'dark') {
                    isDark = true;
                } else if (stored === 'light') {
                    isDark = false;
                } else {
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark-mode');
                    document.documentElement.dataset.theme = 'dark';
                    document.body.dataset.theme = 'dark';
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark-mode');
                    document.documentElement.dataset.theme = 'light';
                    document.body.dataset.theme = 'light';
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch (e) {}
        })();
    </script>
    <div id="root">
        <!-- 简体中文注释：静态高保真极简加载进度条，在 React 挂载前展示，挂载后会被 AppStartupScreen 替换 -->
        <div class="app-startup-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; overflow: hidden; padding: 32px; background: #09090b; transition: opacity 0.3s ease;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; width: 100%; max-width: 280px;">
                <!-- 进度数字：初始显示 99% 并在 React 未加载时由进度条补充动感 -->
                <div style="font-size: 36px; font-weight: 600; color: #f4f4f5; letter-spacing: -0.02em;">99%</div>
                <!-- 极细渐变进度条：珊瑚橙到粉红渐变色 -->
                <div style="width: 100%; height: 6px; border-radius: 9999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; position: relative;">
                    <div style="height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #ec4899); border-radius: 9999px; animation: progress-fill 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;"></div>
                </div>
                <!-- 正在载入文本 -->
                <p style="margin: 0; font-size: 13px; font-weight: 500; color: #a1a1aa; opacity: 0.8; animation: pulse-text 1.5s ease-in-out infinite;">正在载入创作空间...</p>
            </div>
        </div>
        <style>
            @keyframes progress-fill {
                0% { width: 0%; }
                100% { width: 99%; }
            }
            @keyframes pulse-text {
                0%, 100% { opacity: 0.5; }
                50% { opacity: 0.8; }
            }
            .dark-mode .app-startup-screen {
                --text-primary: #f4f4f5;
                --text-secondary: #a1a1aa;
            }
            body:not(.dark-mode) .app-startup-screen {
                --text-primary: #18181b;
                --text-secondary: #71717a;
            }
        </style>
    </div>
    <script>
        (function () {
            var turnstileScriptUrl = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            var turnstileScriptSelector = 'script[data-turnstile-script="true"]';

            if (document.querySelector(turnstileScriptSelector)) {
                return;
            }

            var script = document.createElement('script');
            script.src = turnstileScriptUrl;
            script.async = true;
            script.defer = true;
            script.dataset.turnstileScript = 'true';

            if ('fetchPriority' in script) {
                script.fetchPriority = 'high';
            }

            document.head.appendChild(script);
        })();
    </script>
    <script type="module" src="/src/bootstrap.tsx"></script>
</body>

</html>
