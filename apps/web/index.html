<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="description" content="KK Studio - AI Image Generation Workspace" />
    <title>KK Studio - AI Image Workspace</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="dns-prefetch" href="//challenges.cloudflare.com" />
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'HarmonyOS Sans SC', 'Inter', sans-serif;
            background: #09090b;
            color: #ffffff;
        }

        body:not(.dark-mode) {
            background: #fffaf0;
            color: #0a0a0a;
        }
    </style>
</head>

<body>
    <script>
        // 简体中文注释：立即执行脚本，避免 React 挂载前由于亮暗色状态不同产生首屏闪白
        (function () {
            try {
                var stored = localStorage.getItem('theme') || localStorage.getItem('kk_theme');
                var isDark = false;
                if (stored === 'dark') {
                    isDark = true;
                } else if (stored === 'light') {
                    isDark = false;
                } else {
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('dark-mode');
                    document.documentElement.dataset.theme = 'dark';
                    document.body.dataset.theme = 'dark';
                    document.documentElement.style.colorScheme = 'dark';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.remove('dark-mode');
                    document.documentElement.dataset.theme = 'light';
                    document.body.dataset.theme = 'light';
                    document.documentElement.style.colorScheme = 'light';
                }
            } catch (e) {}
        })();
    </script>
    <div id="root">
        <!-- 简体中文注释：静态极简加载圆环，在 React 挂载前展示 -->
        <div class="app-startup-screen" style="display: flex; align-items: center; justify-content: center; min-height: 100dvh; background: #09090b;">
            <div class="spinner" style="width: 24px; height: 24px; border: 2px solid rgba(56, 189, 248, 0.2); border-top-color: rgb(56, 189, 248); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
        <style>
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </div>
    <script>
        (function () {
            var turnstileScriptUrl = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            var turnstileScriptSelector = 'script[data-turnstile-script="true"]';

            if (document.querySelector(turnstileScriptSelector)) {
                return;
            }

            var script = document.createElement('script');
            script.src = turnstileScriptUrl;
            script.async = true;
            script.defer = true;
            script.dataset.turnstileScript = 'true';

            if ('fetchPriority' in script) {
                script.fetchPriority = 'high';
            }

            document.head.appendChild(script);
        })();
    </script>
    <script type="module" src="/src/bootstrap.tsx"></script>
</body>

</html>
