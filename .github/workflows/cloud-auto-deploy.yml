name: Cloud Auto Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install web app dependencies
        run: npm ci --prefix apps/web --legacy-peer-deps

      - name: Governance, tests, and build
        run: npm run verify:changes

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-build
          path: apps/web/dist
          if-no-files-found: error

  deploy-vps-api:
    runs-on: ubuntu-latest
    needs: verify
    env:
      KK_VPS_DEPLOY_COMMAND: ${{ secrets.KK_VPS_DEPLOY_COMMAND }}
    steps:
      - name: Run VPS deploy command
        if: ${{ env.KK_VPS_DEPLOY_COMMAND != '' }}
        run: bash -lc "$KK_VPS_DEPLOY_COMMAND"

      - name: Skip VPS deploy
        if: ${{ env.KK_VPS_DEPLOY_COMMAND == '' }}
        run: echo "KK_VPS_DEPLOY_COMMAND is not configured; skipping VPS API deploy."

  deploy-netlify:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-build
          path: apps/web/dist

      - name: Install Netlify CLI
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: npm install --global netlify-cli@latest

      - name: Deploy to Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: netlify deploy --dir=apps/web/dist --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"

      - name: Skip Netlify deploy
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' || env.NETLIFY_SITE_ID == '' }}
        run: echo "Netlify secrets are not configured; skipping Netlify deploy."

  deploy-vercel:
    runs-on: ubuntu-latest
    needs:
      - verify
      - deploy-vps-api
    if: ${{ always() && needs.verify.result == 'success' && needs.deploy-vps-api.result != 'failure' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Skip Vercel deploy
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: echo "VERCEL_TOKEN is not configured; skipping Vercel deploy."
