openapi: 3.1.0
info:
  title: KK Studio API
  version: 1.6.0
  summary: KK Studio 完整 REST API 契约（OpenAPI 3.1）
  description: |
    KK Studio 是面向多模态 AI 创作、无限画布资产管理、多模型智能路由、用户自主密钥（BYOK）
    与商业化积分计费审计的一体化 AI 工作台。本规范覆盖主服务（Express，默认端口 3001）的全部
    HTTP 接口，按业务域分为：健康检查、认证与用户、AI 生成网关、BYOK 密钥/路由管理、计费支付、
    画布工作区与资产、模型目录、管理后台、AI 助手持久化等分组。

    ## 通用约定

    ### 认证方式
    1. **Bearer JWT** —— `Authorization: Bearer <jwt>`，主要方式。
    2. **HttpOnly Cookie 会话** —— `kk.api.access_token` / `kk.api.refresh_token`。
    3. **临时用户头** —— `X-KK-Temp-User-Id: temp-xxxx`（仅 `KKAI_LOCAL_ONLY=true` 时允许）。
    4. **管理员二次会话头** —— `X-KK-Admin-Session-Token`（管理后台高危操作）。

    响应头 `X-Refresh-Token` 用于滑动续签 JWT；CORS `credentials: true`，
    `exposedHeaders: ['X-Refresh-Token']`。管理员分级：`admin_level` 1=超管，2=普通管理员。

    ### 响应信封
    新式路由统一返回：

    ```json
    // 成功
    { "success": true, "data": { }, "meta": { "requestId": "req-...", "timestamp": "ISO-8601" } }
    // 失败
    { "success": false, "error": { "code": "UPPER_SNAKE_CODE", "message": "...", "details": {} }, "meta": { } }
    ```

    部分旧式路由（admin、generate-v1、ocr）使用扁平变体 `{ "success": false, "error": "msg", "code": "CODE" }`
    或裸 `{ "error": "..." }`。全局兜底：404 `{ "error": "Endpoint not found or legacy route disabled." }`、
    500 `{ "error": "Internal server error." }`。

    ### 分页
    - 管理列表：`page`(≥1)、`limit`(1–100，默认 20)、`search`，响应 `{ items, total, page, limit }`。
    - 生成作业列表：cursor 分页 —— `limit`(≤100，默认 50)、`cursor`(ISO 时间，取 `created_at < cursor`)，响应 `{ jobs, cursor? }`。

    ### 请求体限制
    `/api/v1/generate*`、`/api/v1/assets`、`/api/generate/image|edit`：10mb JSON；其余：1mb JSON。
  contact:
    name: KK Studio Team
servers:
  - url: https://api.kkai.plus
    description: 生产环境主 API / BFF
  - url: http://localhost:3001
    description: 本地开发主服务（Express）
  - url: http://localhost:9099
    description: 本地安全执行器（local-runner，独立服务）
security:
  - bearerAuth: []
tags:
  - name: System
    description: 健康检查与遥测
  - name: Auth
    description: 注册、登录、会话、OAuth、临时用户
  - name: Profile
    description: 用户档案与密码管理
  - name: Generation
    description: AI 生成网关与代理（统一入口、异步任务、BYOK/系统代理）
  - name: BYOK
    description: 用户自带密钥与路由管理、供应商探测、价格同步
  - name: Billing
    description: 积分余额、流水、扣费退款、充值申请、支付渠道
  - name: Workspace
    description: 画布布局、卡片、工作流
  - name: Assets
    description: 资产库（图片/视频/音频/文档）
  - name: Generation Jobs
    description: 轻量任务与批量生成作业（Durable Queue）
  - name: Model Catalog
    description: 模型目录
  - name: Admin
    description: 管理后台（用户、积分、计费供应商、汇率、充值审核）
  - name: AI Assistant
    description: AI 助手运行记录、工具调用、技能与知识库持久化
  - name: Local Runner
    description: 本地执行器接口（端口 9099）

paths:
  # ==================== System ====================
  /healthz:
    get:
      tags: [System]
      summary: 综合健康检查
      description: 返回服务、持久化、运行时、认证、数据库、上传、供应商等全方位健康状态。unhealthy 时返回 HTTP 500。
      operationId: healthz
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
              example:
                ok: true
                success: true
                service: kk-studio-api
                status: healthy
                selfHostedCoreReady: true
                canonicalPersistenceReady: true
                config:
                  hasPostgresConfig: true
                runtime:
                  localOnly: false
                  blockers: []
                auth:
                  hasJwtSecret: true
                database:
                  postgres: true
                uploads:
                  uploadDirExists: true
                  s3Enabled: false
                provider:
                  openai: true
                  gemini: true
        '500':
          description: 服务不健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
  /v1/health:
    get:
      tags: [System]
      summary: 数据库与本地存储探测
      operationId: v1Health
      security: []
      responses:
        '200':
          description: 探测结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  details:
                    type: object
                    properties:
                      database: { type: string, example: ok }
                      localStorage: { type: string, example: ok }
              example:
                status: ok
                timestamp: '2026-07-21T04:00:00.000Z'
                details:
                  database: ok
                  localStorage: ok
  /v1/metrics:
    get:
      tags: [System]
      summary: AI Router 运行指标
      description: 返回 AI 路由器的请求统计与熔断器状态。
      operationId: v1Metrics
      security: []
      responses:
        '200':
          description: 指标数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                data:
                  totalRequests: 12840
                  successRate: 0.987
                  circuitBreaker:
                    state: closed
                    failures: 0
  /api/config/keys:
    get:
      tags: [System]
      summary: 渠道 Key 配置状态
      description: 返回各渠道 API Key 是否已配置（不返回明文）。
      operationId: configKeys
      security: []
      responses:
        '200':
          description: 配置状态
          content:
            application/json:
              example:
                ACTIVE_API_PROVIDER: suchuang
                _configured:
                  SUCHUANG_API_KEY: true
                  YUNWU_API_KEY: false
                  COMFLY_API_KEY: true

  # ==================== Auth ====================
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 邮箱注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: 至少 8 位 }
            example:
              email: user@example.com
              password: Str0ngP@ssw0rd
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                data:
                  userId: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                  email: user@example.com
                  status: registered
        '400':
          description: 参数错误（AUTH_INVALID_PAYLOAD / AUTH_WEAK_PASSWORD / AUTH_USER_ALREADY_EXISTS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: AUTH_USER_ALREADY_EXISTS
                  message: 该邮箱已被注册
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 邮箱登录
      description: 登录成功返回会话信息，同时写入 HttpOnly Cookie 并通过 `X-Refresh-Token` 头下发刷新令牌。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: user@example.com
              password: Str0ngP@ssw0rd
      responses:
        '200':
          description: 登录成功
          headers:
            X-Refresh-Token:
              description: 滑动续签刷新令牌
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
              example:
                success: true
                data:
                  user:
                    id: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                    email: user@example.com
                    nickname: 创作者小K
                    avatarUrl: https://cdn.kkai.plus/avatars/u1.png
                    adminLevel: 0
                    role: user
                    status: active
                    createdAt: '2026-01-15T08:00:00.000Z'
                    updatedAt: '2026-07-20T12:00:00.000Z'
                  accessToken: eyJhbGciOiJIUzI1NiIs...
                  refreshToken: d2f4e6a8b0c2...
                  sessionExpiresAt: '2026-07-28T04:00:00.000Z'
        '401':
          description: 凭证错误（AUTH_INVALID_CREDENTIALS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新会话
      operationId: refreshSession
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
            example:
              refreshToken: d2f4e6a8b0c2...
      responses:
        '200':
          description: 新会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 登出
      description: 清除会话 Cookie。
      operationId: logout
      responses:
        '200':
          description: 已登出
          content:
            application/json:
              example:
                success: true
                data:
                  loggedOut: true
  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: 获取当前会话
      operationId: getSession
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/token:
    get:
      tags: [Auth]
      summary: 换取 JWT
      description: 基于当前会话换取访问 JWT。
      operationId: getToken
      responses:
        '200':
          description: JWT
          content:
            application/json:
              example:
                jwt: eyJhbGciOiJIUzI1NiIs...
                user:
                  id: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                  email: user@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: 请求密码重置
      description: 出于隐私保护，无论邮箱是否存在都返回统一应答。
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example:
              email: user@example.com
      responses:
        '200':
          description: 统一应答
          content:
            application/json:
              example:
                success: true
                data:
                  requested: true
                  email: user@example.com
                  delivery: email
                  status: accepted
                  code: AUTH_PASSWORD_RESET_REQUESTED
                  message: 如果该邮箱已注册，重置邮件已发送
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: 确认密码重置
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, minLength: 24 }
                newPassword: { type: string, minLength: 8 }
            example:
              token: 9f8e7d6c5b4a39281706f5e4d3c2b1a0
              newPassword: N3wP@ssw0rd!
      responses:
        '200':
          description: 重置完成
          content:
            application/json:
              example:
                success: true
                data:
                  updated: true
                  status: completed
                  code: AUTH_PASSWORD_RESET_COMPLETED
                  message: 密码已更新
        '400':
          description: 令牌无效（AUTH_INVALID_RESET_TOKEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/temp-users:
    post:
      tags: [Auth]
      summary: 创建临时用户
      description: 创建 24 小时有效的临时用户（游客会话），无需注册。
      operationId: createTempUser
      security: []
      responses:
        '201':
          description: 临时用户已创建
          content:
            application/json:
              example:
                success: true
                data:
                  userId: temp-9b8a7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
                  email: temp-9b8a@guest.local
                  nickname: 访客-9b8a
                  createdAt: '2026-07-21T04:00:00.000Z'
                  expiresAt: '2026-07-22T04:00:00.000Z'
                  isTempUser: true
  /api/v1/auth/{provider}/start:
    get:
      tags: [Auth]
      summary: OAuth 登录起点
      description: 获取第三方登录授权跳转 URL。
      operationId: oauthStart
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, wechat] }
      responses:
        '200':
          description: 授权 URL
          content:
            application/json:
              example:
                success: true
                data:
                  provider: google
                  mode: login
                  authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
                  state: 8f7e6d5c4b3a
                  expiresAt: '2026-07-21T04:10:00.000Z'
  /api/v1/auth/{provider}/bind/start:
    get:
      tags: [Auth]
      summary: OAuth 绑定起点
      description: 已登录用户绑定第三方账号的授权跳转 URL。
      operationId: oauthBindStart
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, wechat] }
      responses:
        '200':
          description: 授权 URL
          content:
            application/json:
              example:
                success: true
                data:
                  provider: wechat
                  mode: bind
                  authorizationUrl: https://open.weixin.qq.com/connect/qrconnect?appid=...
                  state: 1a2b3c4d5e6f
                  expiresAt: '2026-07-21T04:10:00.000Z'

  # ==================== Profile ====================
  /api/v1/profile:
    get:
      tags: [Profile]
      summary: 获取用户档案
      operationId: getProfile
      responses:
        '200':
          description: 用户档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
              example:
                success: true
                data:
                  id: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                  email: user@example.com
                  nickname: 创作者小K
                  avatarUrl: https://cdn.kkai.plus/avatars/u1.png
                  adminLevel: 0
                  role: user
                  status: active
                  credits: 1250
                  createdAt: '2026-01-15T08:00:00.000Z'
                  updatedAt: '2026-07-20T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: 更新用户档案
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string }
                avatarUrl: { type: string, format: uri }
            example:
              nickname: 新昵称
              avatarUrl: https://cdn.kkai.plus/avatars/u2.png
      responses:
        '200':
          description: 更新后的档案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
  /api/v1/profile/password/send-code:
    post:
      tags: [Profile]
      summary: 发送改密验证码
      operationId: sendPasswordCode
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              example:
                success: true
                data:
                  sent: true
                  email: user@example.com
                  expiresAt: '2026-07-21T04:10:00.000Z'
  /api/v1/profile/password:
    post:
      tags: [Profile]
      summary: 修改密码
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 8 }
            example:
              newPassword: N3wP@ssw0rd!
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              example:
                success: true
                data:
                  updated: true
                  profile:
                    id: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                    email: user@example.com
  /api/user/me:
    get:
      tags: [Profile]
      summary: 获取当前用户（旧式）
      operationId: getUserMe
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              example:
                id: 3f8a1c2e-7b4d-4e1a-9c5f-2d8b6a0e1f3c
                email: user@example.com
                credits: 1250
                created_at: '2026-01-15T08:00:00.000Z'
                adminLevel: 0
    patch:
      tags: [Profile]
      summary: 更新当前用户（旧式）
      operationId: updateUserMe
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: newmail@example.com
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  # ==================== Generation ====================
  /api/v1/generate:
    post:
      tags: [Generation]
      summary: 统一同步生成
      description: |
        特权大模型"零直连前端"统一入口（请求体上限 10mb）。
        - 带 `routeId`（或头 `X-Key-Slot-Id`）→ 走 BYOK 用户自有路由派发（白名单域名校验）。
        - 不带 → 走系统积分模型派发（含积分预扣，失败自动退款）。
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                routeId: { type: string, description: BYOK 路由 ID }
                task_type: { type: string, example: chat }
                requestId: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                model: { type: string, default: gpt-4o-mini }
                temperature: { type: number, default: 0.7 }
                prompt: { type: string, description: 图像模式提示词 }
            examples:
              chat:
                summary: 对话生成
                value:
                  task_type: chat
                  model: gpt-4o-mini
                  temperature: 0.7
                  messages:
                    - role: user
                      content: 帮我写一句产品 slogan
              image:
                summary: 图像生成（BYOK 路由）
                value:
                  routeId: route-01HXYZ
                  task_type: image
                  prompt: 一只在云端飞翔的橘猫，吉卜力风格
      responses:
        '200':
          description: 上游生成结果
          content:
            application/json:
              example:
                success: true
                data:
                  content: 让灵感，即刻成像。
                  usage:
                    total_tokens: 42
        '400':
          description: UNSUPPORTED_TASK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: FORBIDDEN_PROXY_TARGET（目标域名不在白名单）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: USER_ROUTE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: AI_CHAT_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generate/async:
    post:
      tags: [Generation]
      summary: 异步任务提交 / 轮询
      description: |
        提交或查询异步生成任务（图像/视频/音频）。`mode=task_status` 时通过
        `localTaskId` 或 `taskId` 轮询状态（可从任务 ID 解码 routeId）。
      operationId: generateAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [image, video, audio, task_status] }
                localTaskId: { type: string }
                taskId: { type: string }
                routeId: { type: string }
                prompt: { type: string }
            examples:
              submit:
                summary: 提交视频任务
                value:
                  mode: video
                  routeId: route-01HXYZ
                  prompt: 延时摄影：城市日落到夜晚
              poll:
                summary: 轮询任务状态
                value:
