      tags: [Assets]
      summary: 资产列表
      operationId: listAssets
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [image, video, audio, document] }
        - name: limit
          in: query
          schema: { type: integer, maximum: 500 }
      responses:
        '200':
          description: 资产列表
          content:
            application/json:
              example:
                success: true
                data:
                  items:
                    - id: asset-01
                      kind: image
                      storagePath: /api/v1/assets/asset-01/content
                      mimeType: image/png
                      sizeBytes: 204800
                      metadata: {}
                      createdAt: '2026-07-20T10:00:00.000Z'
                      updatedAt: '2026-07-20T10:00:00.000Z'
    post:
      tags: [Assets]
      summary: 上传资产
      description: 以 data URL 方式上传资产（请求体上限 10mb）。
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, dataUrl]
              properties:
                kind: { type: string, enum: [image, video, audio, document] }
                dataUrl: { type: string, description: 'data:mime;base64,...' }
                mimeType: { type: string }
                id: { type: string }
                sizeBytes: { type: integer }
                metadata: { type: object }
            example:
              kind: image
              dataUrl: data:image/png;base64,iVBORw0KGgoAAAANSUhEUg...
              mimeType: image/png
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              example:
                success: true
                data:
                  asset:
                    id: asset-01
                    kind: image
                    storagePath: /api/v1/assets/asset-01/content
                    mimeType: image/png
                    sizeBytes: 204800
                    createdAt: '2026-07-21T04:00:00.000Z'
                    updatedAt: '2026-07-21T04:00:00.000Z'
                  url: /api/v1/assets/asset-01/content
        '400':
          description: ASSET_KIND_INVALID / ASSET_DATA_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/assets/{assetId}/content:
    get:
      tags: [Assets]
      summary: 获取资产二进制内容
      description: "返回资产原始二进制流（`Cache-Control: private, max-age=31536000, immutable`）。"
      operationId: getAssetContent
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
