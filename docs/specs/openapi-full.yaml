        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/generation-jobs:
    post:
      tags: [Generation Jobs]
      summary: 创建批量生成作业
      description: Durable Queue 批量作业，一次提交多个 prompt，支持并发控制与输出分组。
      operationId: createGenerationJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationJobRequest'
            example:
              idempotencyKey: batch-001
              workspaceId: ws-01
              modelCode: gpt-image-1
              taskType: image
              concurrency: 3
              parameters:
                size: 1024x1024
              prompts:
                - id: p1
                  prompt: 商品主图：白色背景
                - id: p2
                  prompt: 商品场景图：客厅
                  referenceImageNodeId: node-01
              outputGroup: group-01
      responses:
        '201':
          description: 作业已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobEnvelope'
        '400':
          description: INVALID_GENERATION_JOB / GENERATION_JOB_CREATE_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [Generation Jobs]
      summary: 批量生成作业列表（cursor 分页）
      operationId: listGenerationJobs
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, paused, completed, failed, cancelled]
        - name: limit
          in: query
          schema: { type: integer, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: date-time }
          description: 取 created_at 早于该时间的记录
      responses:
        '200':
          description: 作业列表
          content:
            application/json:
              example:
                jobs:
                  - schemaVersion: 2
                    id: job-01HX
                    idempotencyKey: batch-001
                    workspaceId: ws-01
                    modelCode: gpt-image-1
                    taskType: image
                    status: running
                    progress:
                      total: 2
                      completed: 1
                      failed: 0
                      percent: 50
                    outputs: []
                    items: []
                    createdAt: '2026-07-21T03:00:00.000Z'
                    updatedAt: '2026-07-21T03:05:00.000Z'
                cursor: '2026-07-21T03:00:00.000Z'
  /api/v1/generation-jobs/{jobId}:
    get:
      tags: [Generation Jobs]
      summary: 获取批量生成作业
      operationId: getGenerationJob
      parameters:
        - $ref: '#/components/parameters/GenerationJobId'
      responses:
        '200':
          description: 作业详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobEnvelope'
        '404':
          description: GENERATION_JOB_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [Generation Jobs]
      summary: 更新批量生成作业（需持租约）
      description: 更新作业状态/进度/输出。必须携带有效租约，冲突时返回 409。
      operationId: updateGenerationJob
      parameters:
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseOwner, leaseExpiresAt]
              properties:
                status: { type: string, enum: [queued, running, paused, completed, failed, cancelled] }
                progress:
                  type: object
                  properties:
                    percent: { type: number }
                outputs: { type: array, items: { type: object } }
                items: { type: array, items: { type: object } }
                leaseOwner: { type: string }
                leaseExpiresAt: { type: string, format: date-time }
            example:
              status: running
              progress:
                percent: 75
              leaseOwner: worker-01
              leaseExpiresAt: '2026-07-21T04:30:00.000Z'
      responses:
        '200':
          description: 更新后的作业
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobEnvelope'
        '409':
          description: GENERATION_JOB_LEASE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generation-jobs/{jobId}/control:
    post:
      tags: [Generation Jobs]
      summary: 控制批量生成作业
      operationId: controlGenerationJob
      parameters:
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, cancel] }
            example:
              action: pause
      responses:
        '200':
          description: 控制结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobEnvelope'
        '400':
          description: INVALID_GENERATION_JOB_CONTROL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/generation-jobs/{jobId}/claim:
    post:
      tags: [Generation Jobs]
      summary: 抢占作业租约
      operationId: claimGenerationJob
      parameters:
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseOwner, leaseSeconds]
              properties:
                leaseOwner: { type: string }
                leaseSeconds: { type: integer }
            example:
              leaseOwner: worker-01
              leaseSeconds: 300
      responses:
        '200':
          description: 租约获取结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJobEnvelope'
        '409':
          description: GENERATION_JOB_LEASE_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

