components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 主要认证方式。也可使用 HttpOnly Cookie 会话（kk.api.access_token）。
    tempUserHeader:
      type: apiKey
      in: header
      name: X-KK-Temp-User-Id
      description: 临时用户头（仅 KKAI_LOCAL_ONLY=true 时允许），格式 temp-xxxx。
    adminSessionHeader:
      type: apiKey
      in: header
      name: X-KK-Admin-Session-Token
      description: 管理员二次会话令牌（verify-password 接口返回），用于管理后台高危操作。
  parameters:
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
    GenerationJobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
    ProviderId:
      in: path
      name: providerId
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: 未认证或认证无效（UNAUTHORIZED / AUTH_REQUIRED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: 请先登录
    Forbidden:
      description: 无权限（FORBIDDEN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 大写下划线错误码
          example: AUTH_INVALID_CREDENTIALS
        message:
          type: string
          example: 邮箱或密码错误
        details:
          type: object
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      properties:
        requestId:
          type: string
          example: req-01HXYZABC
        timestamp:
          type: string
          format: date-time
    HealthzResponse:
      type: object
      properties:
        ok: { type: boolean }
        success: { type: boolean }
        service: { type: string, example: kk-studio-api }
        status: { type: string, enum: [healthy, unhealthy] }
        selfHostedCoreReady: { type: boolean }
        canonicalPersistenceReady: { type: boolean }
        config: { type: object }
        repositories: { type: object }
        persistence: { type: object }
        runtime:
          type: object
          properties:
            localOnly: { type: boolean }
            blockers: { type: array, items: { type: string } }
        auth: { type: object }
        database: { type: object }
        uploads: { type: object }
        provider: { type: object }
    AuthSessionEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessToken: { type: string }
            refreshToken: { type: string }
            sessionExpiresAt: { type: string, format: date-time }
        meta:
          $ref: '#/components/schemas/Meta'
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }
        avatarUrl: { type: string, format: uri }
        adminLevel: { type: integer, description: '0=普通用户 1=超管 2=管理员' }
        role: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfileEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          allOf:
            - $ref: '#/components/schemas/User'
            - type: object
              properties:
                credits: { type: integer, example: 1250 }
        meta:
          $ref: '#/components/schemas/Meta'
    UserApiEntry:
      type: object
      properties:
        id: { type: string }
        key: { type: string, description: API Key（响应中通常脱敏） }
        name: { type: string }
        provider: { type: string }
        type: { type: string, enum: [official, proxy, third-party] }
        format: { type: string, enum: [gemini, openai, auto, claude] }
        baseUrl: { type: string, format: uri }
        supportedModels: { type: array, items: { type: string } }
        disabled: { type: boolean }
        status: { type: string, enum: [valid, invalid, rate_limited, unknown] }
        failCount: { type: integer }
        successCount: { type: integer }
        totalCost: { type: number }
        budgetLimit: { type: number, description: '-1 表示无限制' }
        tokenLimit: { type: integer }
        usedTokens: { type: integer }
        lastUsed: { type: string, format: date-time }
        lastError: { type: string }
        endpointType: { type: string }
        adapterId: { type: string }
        requestProfileId: { type: string }
        protocolFamily: { type: string }
        routeStrategy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserApiEntriesPayload:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UserApiEntry'
    ProviderProbeRequest:
      type: object
      required: [baseUrl, apiKey]
      properties:
        providerName: { type: string }
        providerHint: { type: string }
        providerKind:
          type: string
          enum: [official, relay]
          default: relay
        baseUrl: { type: string, maxLength: 2048, format: uri }
        apiKey: { type: string, maxLength: 4096 }
        modelId: { type: string }
        endpointType: { type: string, default: auto }
        requestProfileId: { type: string }
    CreateGenerationJobRequest:
      type: object
      required: [idempotencyKey, workspaceId, modelCode, taskType, prompts]
      properties:
        idempotencyKey: { type: string }
        workspaceId: { type: string }
        modelCode: { type: string }
        taskType: { type: string, enum: [image, video, audio, chat] }
        parameters: { type: object }
        prompts:
          type: array
          items:
            type: object
            required: [id, prompt]
            properties:
              id: { type: string }
              prompt: { type: string }
              referenceImageNodeId: { type: string }
        concurrency: { type: integer }
        outputGroup: { type: string }
    GenerationJob:
      type: object
      properties:
        schemaVersion: { type: integer, example: 2 }
        id: { type: string }
        idempotencyKey: { type: string }
        workspaceId: { type: string }
        modelCode: { type: string }
        taskType: { type: string, enum: [image, video, audio, chat] }
        status:
          type: string
          enum: [queued, running, paused, completed, failed, cancelled]
        parameters: { type: object }
        progress:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            failed: { type: integer }
            percent: { type: number }
        outputs: { type: array, items: { type: object } }
        items: { type: array, items: { type: object } }
        outputGroup: { type: string }
        leaseOwner: { type: string }
        leaseExpiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GenerationJobEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/GenerationJob'
        meta:
          $ref: '#/components/schemas/Meta'
    SaveCreditProviderRequest:
      type: object
      required: [providerName, baseUrl, providerKind, models]
      properties:
        providerName: { type: string }
        baseUrl: { type: string, format: uri }
        providerKind: { type: string, enum: [official, relay] }
        apiKeys: { type: array, items: { type: string } }
        retainApiKeyFingerprints: { type: array, items: { type: string } }
        models:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [modelId, displayName, creditCost]
            properties:
              modelId: { type: string }
              displayName: { type: string }
              description: { type: string }
              endpointType: { type: string, default: openai_chat_completions }
              requestProfileId: { type: string }
              routeStrategy:
                type: string
                enum: [priority-failover, weighted-random, parallel-race]
              creditCost: { type: integer }
              advancedEnabled: { type: boolean }
              mixWithSameModel: { type: boolean }
              qualityPricing: { type: object }
              priority: { type: integer }
              weight: { type: integer }
              isActive: { type: boolean }
              color: { type: string }
              colorSecondary: { type: string }
              textColor: { type: string }
              maxCallsLimit: { type: integer }
              autoPauseOnLimit: { type: boolean }
