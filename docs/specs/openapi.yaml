openapi: 3.1.0
info:
  title: KK Studio Unified API
  version: 1.0.0
  summary: REST + OpenAPI 3.1 contract for the server-backed API and current billing routes.
  description: |
    This contract freezes the first wave of external and internal-facing APIs used by KK Studio.
    All routes return a unified JSON envelope and use typed DTOs through the current server/ backend.
servers:
  - url: https://api.kkai.plus
    description: Main API / BFF
security:
  - bearerAuth: []
tags:
  - name: Auth API
  - name: User/Profile API
  - name: Canvas/Workflow API
  - name: Generation Task API
  - name: Asset Library API
  - name: Billing/Credits API
  - name: Model Catalog API
  - name: Admin API
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth API]
      summary: Legacy password registration endpoint (disabled)
      operationId: registerUser
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '501':
          $ref: '#/components/responses/RouteDisabled'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/login:
    post:
      tags: [Auth API]
      summary: Legacy password login endpoint (disabled)
      operationId: loginUser
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '501':
          $ref: '#/components/responses/RouteDisabled'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/temp-users:
    post:
      tags: [Auth API]
      summary: Create a guest temp-user session without a full Supabase login
      operationId: createTempUser
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '201':
          description: Guest temp-user session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempUserSessionResponseEnvelope'
  /api/v1/profile:
    get:
      tags: [User/Profile API]
      summary: Get current user profile
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Profile payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [User/Profile API]
      summary: Update current user profile
      operationId: updateProfile
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/profile/user-apis:
    get:
      tags: [User/Profile API]
      summary: Get the current user's stored API-key entries
      operationId: getUserApiEntries
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: User API entries payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiEntriesResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User/Profile API]
      summary: Replace the current user's stored API-key entries while preserving other profile payload sections
      operationId: replaceUserApiEntries
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserApiEntriesRequest'
      responses:
        '200':
          description: Updated user API entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiEntriesResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/profile/key-manager-state:
    get:
      tags: [User/Profile API]
      summary: Get the current user's key-manager cloud state
      operationId: getKeyManagerCloudState
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Key-manager cloud state payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyManagerCloudStateResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [User/Profile API]
      summary: Replace the current user's key-manager cloud state while preserving compatible user-api entry mirrors
      operationId: replaceKeyManagerCloudState
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceKeyManagerCloudStateRequest'
      responses:
        '200':
          description: Updated key-manager cloud state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyManagerCloudStateResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceId}/canvas:
    get:
      tags: [Canvas/Workflow API]
      summary: Get canvas summary for a workspace
      operationId: getWorkspaceCanvas
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Canvas summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces/layout:
    get:
      tags: [Canvas/Workflow API]
      summary: Get the authenticated user's cloud-synced workspace layout
      operationId: getWorkspaceLayout
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Workspace layout payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasLayoutResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Canvas/Workflow API]
      summary: Replace the authenticated user's cloud-synced workspace layout snapshot
      operationId: saveWorkspaceLayout
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCanvasLayoutRequest'
      responses:
        '200':
          description: Updated workspace layout payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasLayoutResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/layout/cloud-images:
    delete:
      tags: [Canvas/Workflow API]
      summary: Delete cloud-stored user images while preserving layout metadata
      operationId: cleanupCloudImages
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Cloud image cleanup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupCloudImagesResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceId}/workflows/{workflowId}:
    get:
      tags: [Canvas/Workflow API]
      summary: Get a workflow document
      operationId: getWorkflow
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/WorkflowId'
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Canvas/Workflow API]
      summary: Save a workflow document
      operationId: saveWorkflow
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/WorkflowId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkflowRequest'
      responses:
        '200':
          description: Saved workflow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/generation-tasks:
    post:
      tags: [Generation Task API]
      summary: Create a generation task
      operationId: createGenerationTask
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationTaskRequest'
      responses:
        '202':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTaskResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/generation-tasks/{taskId}:
    get:
      tags: [Generation Task API]
      summary: Get generation task status and outputs
      operationId: getGenerationTask
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationTaskResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/generation-jobs:
    post:
      tags: [Generation Task API]
      summary: Create an idempotent image, video, or audio batch job
      operationId: createGenerationBatchJob
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationBatchJobRequest'
      responses:
        '201':
          description: Batch job created or matched by idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Generation Task API]
      summary: Incrementally list the current user's batch jobs
      operationId: listGenerationBatchJobs
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - in: query
          name: status
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/GenerationJobStatus'
        - in: query
          name: cursor
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Generation batch job page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/generation-jobs/{jobId}:
    get:
      tags: [Generation Task API]
      summary: Get one user-scoped generation batch job
      operationId: getGenerationBatchJob
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/GenerationJobId'
      responses:
        '200':
          description: Generation batch job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Generation Task API]
      summary: Persist progress under the current client lease
      operationId: updateGenerationBatchJob
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGenerationBatchJobRequest'
      responses:
        '200':
          description: Updated generation batch job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/generation-jobs/{jobId}/control:
    post:
      tags: [Generation Task API]
      summary: Pause, resume, retry, or cancel a generation batch job
      operationId: controlGenerationBatchJob
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlGenerationBatchJobRequest'
      responses:
        '200':
          description: Controlled generation batch job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/generation-jobs/{jobId}/claim:
    post:
      tags: [Generation Task API]
      summary: Claim or renew a generation batch job client lease
      operationId: claimGenerationBatchJob
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/GenerationJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimGenerationBatchJobRequest'
      responses:
        '200':
          description: Claimed generation batch job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationBatchJobResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/assets:
    get:
      tags: [Asset Library API]
      summary: List current user assets
      operationId: listAssets
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - in: query
          name: kind
          schema:
            type: string
            enum: [image, video, audio, document]
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Asset page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/billing/credits/balance:
    get:
      tags: [Billing/Credits API]
      summary: Get current credit balance
      operationId: getCreditBalance
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditBalanceResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/billing/credits/transactions:
    get:
      tags: [Billing/Credits API]
      summary: List credit transactions for the current user
      operationId: listCreditTransactions
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - in: query
          name: transactionType
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Credit transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransactionListResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/billing/credits/debit:
    post:
      tags: [Billing/Credits API]
      summary: Debit user credits for a business action
      operationId: debitCredits
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCreditsRequest'
      responses:
        '200':
          description: Credit debit result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebitCreditsResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/billing/credits/refunds:
    post:
      tags: [Billing/Credits API]
      summary: Refund a completed debit transaction
      operationId: refundCredits
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreditsRequest'
      responses:
        '200':
          description: Credit refund result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundCreditsResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/billing/recharge-submissions:
    post:
      tags: [Billing/Credits API]
      summary: Create a new manual recharge submission
      operationId: createRechargeSubmission
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                currencyCode:
                  type: string
                paymentChannel:
                  type: string
                manualProvider:
                  type: string
      responses:
        '201':
          description: Recharge submission created
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [submission]
                    properties:
                      submission:
                        $ref: '#/components/schemas/RechargeSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/billing/recharge-submissions/{submissionId}/proof:
    post:
      tags: [Billing/Credits API]
      summary: Upload payment proof for a recharge submission
      operationId: uploadRechargeProof
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transferReferenceLast4:
                  type: string
                note:
                  type: string
      responses:
        '200':
          description: Recharge proof uploaded
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [submission]
                    properties:
                      submission:
                        $ref: '#/components/schemas/RechargeSubmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/billing/recharge-submissions/{submissionId}/mark-paid:
    post:
      tags: [Billing/Credits API]
      summary: Mark a recharge submission as paying
      operationId: markRechargePaid
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recharge submission marked as paying
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [submission]
                    properties:
                      submission:
                        $ref: '#/components/schemas/RechargeSubmission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/model-catalog/models:
    get:
      tags: [Model Catalog API]
      summary: List public models for the current client
      operationId: listModels
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - in: query
          name: kind
          schema:
            type: string
            enum: [chat, image, video, audio, embedding]
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogResponseEnvelope'
  /api/v1/model-catalog/active-credit-models:
    get:
      tags: [Model Catalog API]
      summary: List active system credit-model routes without exposing provider secrets
      operationId: listActiveCreditModels
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Active credit model routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveCreditModelResponseEnvelope'
  /api/v1/admin/models:
    post:
      tags: [Admin API]
      summary: Create an admin-managed model definition after server-side admin elevation
      operationId: createAdminModel
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminModelRequest'
      responses:
        '201':
          description: Admin model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/credit-providers:
    get:
      tags: [Admin API]
      summary: List admin-managed credit providers without exposing upstream API keys
      operationId: listAdminCreditProviders
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      responses:
        '200':
          description: Credit provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreditProviderResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/credit-providers/{providerId}:
    put:
      tags: [Admin API]
      summary: Create or replace an admin-managed credit provider after server-side admin elevation
      operationId: saveAdminCreditProvider
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
        - $ref: '#/components/parameters/ProviderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAdminCreditProviderRequest'
      responses:
        '200':
          description: Credit provider saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAdminCreditProviderResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Admin API]
      summary: Delete an admin-managed credit provider after server-side admin elevation
      operationId: deleteAdminCreditProvider
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
        - $ref: '#/components/parameters/ProviderId'
      responses:
        '200':
          description: Credit provider deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAdminCreditProviderResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/billing/recharges:
    post:
      tags: [Admin API]
      summary: Recharge credits for a user by identity after server-side admin elevation
      operationId: adminRechargeCredits
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRechargeCreditsRequest'
      responses:
        '200':
          description: Admin recharge applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRechargeCreditsResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/access:
    get:
      tags: [Admin API]
      summary: Resolve whether the current authenticated user has admin access and an active elevated session
      operationId: getAdminAccess
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
      responses:
        '200':
          description: Admin access status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccessResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/session/verify-password:
    post:
      tags: [Admin API]
      summary: Verify the shared admin password and issue an elevated admin session token
      operationId: verifyAdminPassword
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyAdminPasswordRequest'
      responses:
        '200':
          description: Admin password verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyAdminPasswordResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/password:
    post:
      tags: [Admin API]
      summary: Change the shared admin password with an active elevated admin session
      operationId: changeAdminPassword
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminPasswordRequest'
      responses:
        '200':
          description: Admin password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeAdminPasswordResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/users/roles:
    post:
      tags: [Admin API]
      summary: Set a target user's role by id or email identity with an active elevated admin session
      operationId: setUserRole
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/XClientVersion'
        - $ref: '#/components/parameters/XAdminSessionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserRoleRequest'
      responses:
        '200':
          description: User role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetUserRoleResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XRequestId:
      in: header
      name: X-Request-Id
      required: true
      schema:
        type: string
        format: uuid
    XClientVersion:
      in: header
      name: X-Client-Version
      required: false
      schema:
        type: string
    XAdminSessionToken:
      in: header
      name: X-Admin-Session-Token
      required: false
      description: Opaque elevated admin session token returned by `verifyAdminPassword`.
      schema:
        type: string
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid
    GenerationJobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
    ProviderId:
      in: path
      name: providerId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Forbidden:
      description: Caller does not have permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    Conflict:
      description: Business conflict detected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    UnprocessableEntity:
      description: Domain rules rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
    RouteDisabled:
      description: Legacy password-auth route is intentionally disabled; use the hosted Supabase auth flow instead
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseEnvelope'
  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
          format: uuid
        clientVersion:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required: [limit, hasMore]
      properties:
        nextCursor:
          type: string
        limit:
          type: integer
        hasMore:
          type: boolean
    ErrorObject:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
    ErrorResponseEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorObject'
        meta:
          $ref: '#/components/schemas/Meta'
    RegisterRequest:
      type: object
      required: [email, password, turnstileToken]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        turnstileToken:
          type: string
    RegisterResponse:
      type: object
      required: [userId, email, status]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [registered, verification_pending]
    RegisterResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/RegisterResponse'
        meta:
          $ref: '#/components/schemas/Meta'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        turnstileToken:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, profile]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        profile:
          $ref: '#/components/schemas/Profile'
    LoginResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/LoginResponse'
        meta:
          $ref: '#/components/schemas/Meta'
    Profile:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatarUrl:
          type: string
          format: uri
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, suspended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 64
        avatarUrl:
          type: string
          format: uri
    ProfileResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
          success:
            type: boolean
            const: true
          data:
            $ref: '#/components/schemas/Profile'
          meta:
            $ref: '#/components/schemas/Meta'
    UserApiEntry:
      type: object
      required:
        [id, key, name, provider, type, format, supportedModels, disabled, createdAt, updatedAt, status,
        failCount, successCount, totalCost, budgetLimit, tokenLimit, usedTokens, lastUsed, lastError]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        provider:
          type: string
        type:
          type: string
          enum: [official, proxy, third-party]
        format:
          type: string
          enum: [gemini, openai, auto, claude]
        baseUrl:
          type: string
          format: uri
        supportedModels:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        createdAt:
          type: integer
        updatedAt:
          type: integer
        status:
          type: string
          enum: [valid, invalid, rate_limited, unknown]
        failCount:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        totalCost:
          type: number
        budgetLimit:
          type: number
        tokenLimit:
          type: number
        usedTokens:
          type: number
        lastUsed:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
    UserApiEntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UserApiEntry'
    ReplaceUserApiEntriesRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UserApiEntry'
    KeyManagerCloudRecord:
      type: object
      additionalProperties: true
    KeyManagerCloudState:
      type: object
      required: [version, slots, providers, entries]
      properties:
        version:
          type: integer
        slots:
          type: array
          items:
            $ref: '#/components/schemas/KeyManagerCloudRecord'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/KeyManagerCloudRecord'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/UserApiEntry'
    ReplaceKeyManagerCloudStateRequest:
      type: object
      required: [slots]
      properties:
        version:
          type: integer
        slots:
          type: array
          items:
            $ref: '#/components/schemas/KeyManagerCloudRecord'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/KeyManagerCloudRecord'
    UserApiEntriesResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserApiEntryList'
        meta:
          $ref: '#/components/schemas/Meta'
    KeyManagerCloudStateResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/KeyManagerCloudState'
        meta:
          $ref: '#/components/schemas/Meta'
    TempUserSession:
      type: object
      required: [userId, email, nickname, createdAt, expiresAt, isTempUser]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isTempUser:
          type: boolean
          const: true
    TempUserSessionResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TempUserSession'
        meta:
          $ref: '#/components/schemas/Meta'
    CanvasSummary:
      type: object
      required: [workspaceId, canvasId, name, nodeCount, connectionCount, updatedAt]
      properties:
        workspaceId:
          type: string
          format: uuid
        canvasId:
          type: string
          format: uuid
        name:
          type: string
        nodeCount:
          type: integer
        connectionCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    CanvasLayoutRecord:
      type: object
      additionalProperties: true
    CanvasLayout:
      type: object
      required: [canvases]
      properties:
        canvases:
          type: array
          items:
            $ref: '#/components/schemas/CanvasLayoutRecord'
    SaveCanvasLayoutRequest:
      type: object
      required: [canvases]
      properties:
        canvases:
          type: array
          items:
            $ref: '#/components/schemas/CanvasLayoutRecord'
    CanvasResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CanvasSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    CanvasLayoutResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CanvasLayout'
        meta:
          $ref: '#/components/schemas/Meta'
    CleanupCloudImagesResult:
      type: object
      required: [deletedCount, preservedLayout]
      properties:
        deletedCount:
          type: integer
        preservedLayout:
          type: boolean
    CleanupCloudImagesResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CleanupCloudImagesResult'
        meta:
          $ref: '#/components/schemas/Meta'
    WorkflowNode:
      type: object
      required: [id, nodeType, position, config]
      properties:
        id:
          type: string
          format: uuid
        nodeType:
          $ref: '#/components/schemas/WorkflowNodeType'
        position:
          type: object
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        config:
          type: object
          additionalProperties: true
    WorkflowDocument:
      type: object
      required: [id, workspaceId, canvasId, name, status, version, nodes, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        canvasId:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        version:
          type: integer
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        updatedAt:
          type: string
          format: date-time
    SaveWorkflowRequest:
      type: object
      required: [name, version, nodes]
      properties:
        name:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [draft, published, archived]
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
    WorkflowResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkflowDocument'
        meta:
          $ref: '#/components/schemas/Meta'
    CreateGenerationTaskRequest:
      type: object
      required: [workspaceId, workflowId, modelCode, taskType, prompt, idempotencyKey]
      properties:
        workspaceId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        modelCode:
          type: string
        taskType:
          type: string
          enum: [image, video, audio, document]
        prompt:
          type: string
        references:
          type: array
          items:
            type: string
            format: uuid
        idempotencyKey:
          type: string
    GenerationResult:
      type: object
      required: [id, assetId, sequenceNo]
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        sequenceNo:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    GenerationTask:
      type: object
      required: [id, workspaceId, workflowId, modelCode, taskType, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        workflowId:
          type: string
          format: uuid
        modelCode:
          type: string
        taskType:
          type: string
          enum: [image, video, audio, document]
        status:
          $ref: '#/components/schemas/GenerationTaskStatus'
        errorCode:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/GenerationResult'
    GenerationTaskResponseEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/GenerationTask'
        meta:
          $ref: '#/components/schemas/Meta'
    GenerationMediaTaskType:
      type: string
      enum: [image, video, audio]
    GenerationJobStatus:
      type: string
      enum: [queued, running, paused, completed, completed_with_errors, failed, cancelled]
    GenerationJobPhase:
      type: string
      enum: [preparing, queued, uploading, provider_processing, storing, placing_on_canvas, completed, failed]
    GenerationPromptInput:
      type: object
      required: [id, prompt]
      properties:
        id:
          type: string
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        referenceAssetIds:
          type: array
          maxItems: 16
          items:
            type: string
        referenceImageNodeId:
          type: string
    ImageGenerationJobParameters:
      type: object
      required: [taskType]
      properties:
        taskType:
          type: string
          const: image
        aspectRatio:
          type: string
        imageSize:
          type: string
        countPerPrompt:
          type: integer
          minimum: 1
          maximum: 10
    VideoGenerationJobParameters:
      type: object
      required: [taskType, durationSeconds]
      properties:
        taskType:
          type: string
          const: video
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 60
        resolution:
          type: string
        aspectRatio:
          type: string
        generateAudio:
          type: boolean
        firstFrameAssetId:
          type: string
        lastFrameAssetId:
          type: string
        motion:
          type: string
          maxLength: 200
    AudioGenerationJobParameters:
      type: object
      required: [taskType]
      properties:
        taskType:
          type: string
          const: audio
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 600
        voice:
          type: string
          maxLength: 200
        lyrics:
          type: string
          maxLength: 20000
        genre:
          type: string
          maxLength: 200
    GenerationJobParameters:
      oneOf:
        - $ref: '#/components/schemas/ImageGenerationJobParameters'
        - $ref: '#/components/schemas/VideoGenerationJobParameters'
        - $ref: '#/components/schemas/AudioGenerationJobParameters'
      discriminator:
        propertyName: taskType
    GenerationOutputGroup:
      type: object
      required: [label, color]
      properties:
        groupId:
          type: string
        label:
          type: string
          maxLength: 200
        color:
          type: string
          maxLength: 100
        includePromptNodes:
          type: boolean
        tags:
          type: array
          maxItems: 32
          items:
            type: string
        nodeIds:
          type: array
          maxItems: 1000
          items:
            type: string
    CreateGenerationBatchJobRequest:
      type: object
      required: [schemaVersion, workspaceId, modelCode, taskType, prompts, parameters, idempotencyKey]
      properties:
        schemaVersion:
          type: integer
          const: 2
        workspaceId:
          type: string
        modelCode:
          type: string
        taskType:
          $ref: '#/components/schemas/GenerationMediaTaskType'
        prompts:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/GenerationPromptInput'
        parameters:
          $ref: '#/components/schemas/GenerationJobParameters'
        concurrency:
          type: integer
          minimum: 1
          maximum: 8
        outputGroup:
          $ref: '#/components/schemas/GenerationOutputGroup'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 255
    GenerationJobProgress:
      type: object
      required: [total, queued, running, completed, failed, percent, phase]
      properties:
